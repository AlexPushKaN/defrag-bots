<style>
/* Layout: one phone screen — status bar, intake tray, memory board, action bar. Committed single look (toy factory). */
:root{
  --bg-top:#4357f0; --bg-bottom:#262a9e; --ink:#14123a; --cream:#fff7e6; --well:#1b1857; --line:#3a44b8;
  --vir:#ff3d7f; --av:#9cff6b; --tmp:#ff8a3d; --doc:#4d9bff; --raw:#b07bff; --png:#38e0b8; --gold:#ffd23d; --danger:#ff5a5a; --muted:#c9d0ff;
  --display:"Rubik",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));background-color:var(--bg-bottom);color:#fff;font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:480px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px}
.chip{display:flex;flex-direction:column;line-height:1;padding:6px 10px;border-radius:14px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.chip small{font-size:10px;font-weight:800;letter-spacing:.06em;opacity:.7}
.chip b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;margin-top:3px}
.chip.gold{background:var(--gold)}
.chip.slow{background:var(--muted)}
#board.slow{box-shadow:0 0 0 3px var(--muted),0 4px 0 var(--ink)}
.chip.pause{width:48px;align-items:center;justify-content:center;cursor:pointer;padding:0;font:inherit}
.chip.pause span{width:14px;height:18px;border-left:5px solid var(--ink);border-right:5px solid var(--ink);box-sizing:border-box}
.chip.pause:disabled{opacity:.5;cursor:default}
.title{flex:1;min-width:0}
.title h1{margin:0;font-size:clamp(14px,4.2vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:900;text-shadow:0 2px 0 var(--ink);text-wrap:balance}
.title p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:700}
#app{position:relative}
#tray{flex-wrap:wrap;row-gap:8px;align-content:flex-start}
#trayRow2{flex:0 0 100%;display:flex;gap:8px;align-items:stretch;height:50px}
#slowWrap{flex:0 0 122px;position:relative;display:flex}
#slowBtn{flex:1;width:100%;min-height:0;height:100%;padding:0 8px;border-radius:12px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px;font-size:13px;line-height:1.05;text-align:left;position:relative;overflow:visible;
  background:var(--ink);color:#7ff3ff;border:3px solid #7ff3ff;box-shadow:0 0 0 2px var(--ink),0 0 14px 2px rgba(127,243,255,.6),inset 0 0 10px rgba(127,243,255,.3);touch-action:none;transition:opacity .2s,filter .2s}
#slowBtn small{display:block;font-size:10.5px;font-weight:800;color:#c9f9ff;opacity:.85}
#slowUp{position:absolute;right:-6px;top:-20px;min-height:0;height:24px;padding:0 7px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:9px;font-family:var(--mono);font-size:11.5px;font-weight:700;line-height:20px;box-shadow:0 2px 0 var(--ink);white-space:nowrap;z-index:2;touch-action:none}
#slowUp.poor{background:#9aa3d6;opacity:.85}
#slowUp[hidden]{display:none}
#slowBtn #slowFill{position:absolute;left:3px;bottom:3px;height:4px;width:0;border-radius:3px;background:currentColor;transition:width .15s linear}
#slowBtn.calm{opacity:.55;filter:saturate(.6);box-shadow:0 0 0 2px var(--ink)}
#slowBtn.hot{animation:slowhot .9s ease-in-out infinite}
@keyframes slowhot{50%{box-shadow:0 0 0 2px var(--ink),0 0 26px 6px rgba(127,243,255,.95),inset 0 0 14px rgba(127,243,255,.5);transform:scale(1.04)}}
#slowBtn.act{background:#7ff3ff;color:var(--ink);border-color:var(--ink);box-shadow:0 0 18px 4px rgba(127,243,255,.8)}
#slowBtn.act small{color:var(--ink)}
#slowBtn.empty{background:#3a3f66;color:#9aa3d6;border-color:#9aa3d6;box-shadow:0 0 0 2px var(--ink);opacity:.85}
body.slowmo::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(127,243,255,.28));z-index:30}
@media (prefers-reduced-motion:reduce){#slowBtn.hot{animation:none}}
#lane{flex:1;min-width:0;position:relative;border-radius:12px;border:2px dashed rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
#laneHint{color:var(--muted);font-size:11px;font-weight:800;opacity:.7}
#lane:has(#alarm:not([hidden])){border-color:transparent}
#lane:has(#alarm:not([hidden])) #laneHint{display:none}
#lane #alarm{position:absolute;inset:-2px;z-index:2}
#alarm{height:100%;box-sizing:border-box;padding:3px 10px 4px;border-radius:12px;background:var(--danger);color:#fff;border:3px solid var(--ink);display:grid;grid-template-columns:1fr auto;column-gap:8px;align-items:center;font-weight:900;font-size:12px;line-height:1;animation:alarm .6s ease-in-out infinite alternate}
#alarm[hidden]{display:none}
#alarm.refill{background:#24206b;color:var(--muted);animation:none}
#alarm.refill i{background:var(--muted)}
#outl{position:absolute;left:0;top:0;pointer-events:none;z-index:4;opacity:0;overflow:visible}
#outl path{fill:none;stroke:#fff7e6;stroke-width:2;stroke-linecap:square}
#outl.hold{opacity:.5;transition:opacity .25s}
#outl.flash{animation:oflash 1.4s ease-out forwards}
@keyframes oflash{0%{opacity:0}25%{opacity:.55}50%{opacity:.55}100%{opacity:0}}
#alarm b{font-family:var(--mono);font-size:15px}
#alarm div{grid-column:1/-1;height:6px;border-radius:6px;background:rgba(20,18,58,.45);overflow:hidden}
#alarm i{display:block;height:100%;width:100%;background:#fff}
@keyframes alarm{to{box-shadow:0 0 0 5px rgba(255,90,90,.45)}}
#tray{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:16px;background:var(--well);border:3px solid var(--ink);min-height:96px;box-sizing:border-box;touch-action:none}
#tray.warn{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger)}
#current{flex:0 0 auto;display:flex;gap:6px;position:relative;padding-bottom:12px}
.coarse #current::after{content:"поворот: тап · в руке — кнопка ⟳"}
#current::after{content:"повернуть: клик · R · пробел";position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.slot{position:relative;width:76px;height:76px;border-radius:12px;background:#24206b;cursor:grab}
.slot.empty{background:transparent;border:2px dashed var(--line);box-sizing:border-box;cursor:default}
.slot.lifted .piece{opacity:.25}
.slot.hover{box-shadow:0 0 0 2px var(--gold)}
#next{flex:1;display:flex;gap:5px;align-items:center;min-width:0;overflow:hidden;flex-wrap:wrap}
#next .mini{flex:0 0 auto;opacity:.85}
#qcount{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--muted);text-align:right;line-height:1.3}
#qcount b{display:block;font-family:var(--mono);font-size:18px;color:#fff}
#qcount small{display:block;font-size:10px}
#qbar{width:58px;height:8px;border-radius:5px;background:#24206b;border:2px solid var(--ink);margin:3px 0 2px auto;overflow:hidden}
#qbar i{display:block;height:100%;width:0;background:var(--png);transition:width .2s}
#tray.warn #qcount b{color:var(--danger)}
#boardWrap{flex:1;min-height:0;display:grid;place-items:center}
#board{position:relative;border-radius:12px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background-color:var(--well);touch-action:none;overflow:hidden}
.cell{position:absolute;box-sizing:border-box;border:2.5px solid var(--ink);border-radius:7px;display:grid;place-items:center;font-weight:900;font-size:10px;color:var(--ink)}
.piece{position:absolute;inset:0;pointer-events:none}
.piece .cell{pointer-events:auto;cursor:grab}
.piece.busy .cell{cursor:default;animation:work 1s ease-in-out infinite}
@keyframes work{50%{filter:brightness(1.15)}}
.badge{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--cream);border:2.5px solid var(--ink);box-sizing:border-box;display:grid;place-items:center;font-size:12px;z-index:2;pointer-events:none}
.ring{position:absolute;border-radius:50%;z-index:1;pointer-events:none}
.ring.boost{animation:ringboost .65s ease-out}
@keyframes ringboost{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.9)}40%{transform:scale(1.35);box-shadow:0 0 0 6px rgba(255,255,255,.35)}100%{transform:scale(1);box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.ghost .cell{opacity:.55;border-style:dashed}
.ghost.bad .cell{background:var(--danger)!important}
.piece.float{position:fixed;inset:auto;pointer-events:none;z-index:50;opacity:.9}
.ghost .cell,.float .cell{pointer-events:none!important}
.ghost.flash .cell{animation:flash .35s ease-out}
@keyframes flash{from{opacity:.9}to{opacity:0}}
#trash{display:flex;align-items:center;justify-content:center;background:var(--tmp)}
#trash.over{background:var(--danger);transform:scale(1.04)}
#trash small{font-size:11px;font-weight:800;opacity:.8}
.pop{position:absolute;font-weight:900;font-family:var(--mono);color:var(--gold);text-shadow:0 2px 0 var(--ink);pointer-events:none;z-index:5;animation:pop 0.9s ease-out forwards}
@keyframes pop{to{transform:translateY(-30px);opacity:0}}
.actions{display:flex;gap:8px;align-items:stretch}
#robots{display:flex;gap:6px;flex:1;min-width:0;touch-action:none}
.rcard{flex:1;min-width:0;min-height:58px;padding:4px 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:1.1;position:relative;overflow:hidden}
.rcard .rname{font-weight:900;font-size:12px}
.rcard .rpref{font-weight:900;font-size:11px;padding:1px 6px;border-radius:6px;border:2px solid var(--ink);background:var(--cream)}
.rcard .rbar{position:absolute;left:0;bottom:0;height:4px;background:var(--ink);opacity:.55}
.rcard.buy{background:transparent;color:#fff;border-style:dashed;border-color:var(--muted);box-shadow:none}
.rcard.buy.ready{background:var(--gold);color:var(--ink);border-style:solid;border-color:var(--ink);box-shadow:0 3px 0 var(--ink);animation:ready 1s ease-in-out infinite}
@keyframes ready{50%{transform:scale(1.05)}}
.rcard.buy.ready{position:relative;animation:ready 1s ease-in-out infinite,glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 0 var(--ink),0 0 0 5px rgba(255,200,40,.55),0 0 18px 6px rgba(255,200,40,.6)}}
.rcard.buy.nag{overflow:visible;animation:nag .7s ease-in-out infinite,glow .7s ease-in-out infinite}
@keyframes nag{0%,100%{transform:scale(1)}30%{transform:scale(1.14) rotate(-3deg)}60%{transform:scale(1.08) rotate(3deg)}}
.rcard.buy .nagtip{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:900;white-space:nowrap;pointer-events:none}
#trash{flex:0 0 96px;min-height:0;height:100%;flex-direction:row;gap:6px;padding:4px 8px;font-size:14px}
#trash small{white-space:nowrap}
.actions .rcard{padding:4px 3px;min-height:86px}.actions .rcard .rname{white-space:nowrap}
.actions{border-radius:16px;transition:outline-color .1s}
.actions.zone{outline:3px dashed var(--gold);outline-offset:4px}
#rotBtn{flex:0 0 auto;width:98px;min-height:86px;padding:0;font-size:52px;line-height:1;background:var(--gold);touch-action:none;-webkit-user-select:none;user-select:none}
#rotBtn.idle{background:var(--cream);opacity:.75}
#rotBtn.hit{transform:translateY(2px) scale(.96);box-shadow:0 1px 0 var(--ink)}
html.lefty .actions{flex-direction:row-reverse}
html.lefty #robots{flex-direction:row-reverse}
#dialog .hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px}
#dialog .hand button{min-height:40px;padding:6px 12px;font-size:14px}
#dialog .hand button.on{background:var(--gold)}
button{font-family:var(--display);font-weight:900;font-size:15px;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;min-height:46px;cursor:pointer;color:var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold)}
#hint{flex:1;font-size:12px;color:var(--muted);font-weight:700;line-height:1.35}
#overlay{position:fixed;inset:0;display:flex;overflow-y:auto;padding-block:16px;box-sizing:border-box;background:rgba(20,18,58,.72);z-index:100;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{margin:auto;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:20px;padding:20px;max-width:360px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:24px;font-weight:900;text-wrap:balance}
.card p,.card li{margin:0;font-size:13.5px;line-height:1.45;font-weight:500}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
/* v49: start splash, day cards, hints */
#dialog .splash{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 4px}
#dialog .logo{font-size:40px;line-height:.95;text-align:center;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}

.sbots{display:flex;gap:10px}.sbots i{width:44px;height:36px;border-radius:11px;background:#fff;border:3px solid var(--ink);position:relative;box-shadow:0 3px 0 var(--ink)}
.sbots i::before,.sbots i::after{content:"";position:absolute;top:12px;width:7px;height:7px;border-radius:50%;background:var(--ink)}.sbots i::before{left:9px}.sbots i::after{right:9px}

.dayveil{position:fixed;inset:0;z-index:96;display:grid;place-items:center;background:rgba(12,10,40,.6);padding:16px}

.daycard .k{font-family:var(--mono);font-size:12px;color:#5a5690}.daycard h3{margin:2px 0 6px;font-size:22px;font-weight:900}

.hint{position:fixed;z-index:80;pointer-events:none;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;line-height:1.25;box-shadow:0 3px 0 var(--ink);max-width:min(300px,82vw);text-align:center}

<template id="rulesTpl"><h2>Правила</h2><ul>
      <li>На входе <b>три файла на выбор</b>. Ставьте в любом порядке: <b>перетащите</b> файл в память. <b>Тап (клик) по файлу поворачивает его.</b> На телефоне играйте двумя руками: одна несёт файл, большой палец другой жмёт <b>⟳</b> внизу — файл в руке поворачивается на 90° по часовой вокруг своего центра, прямо во время переноса. Пока файл в руке, поворачивает касание в любом месте нижней полосы. Левша? Переключите сторону в паузе. На Mac ещё: правый клик, клавиша <b>R</b> или <b>пробел</b> — и прямо во время переноса.</li>
      <li>Роботы забирают файлы по очереди (самые старые первыми) и платят кредиты. На старте робот один — докупайте ещё (30 и 50 кредитов).</li>
      <li><b>Специализация:</b> зажмите робота внизу — всплывёт веер типов; ведите палец к нужному и отпустите (или нажмите и выберите тапом). Специалист берёт свои файлы первыми и обрабатывает их на 20% быстрее, а чужие — на 20% медленнее. «Любые» — без бонусов и штрафов. Если переключить робота на тип файла, который он уже обрабатывает, остаток работы сразу пойдёт быстрее; переключение на другой тип текущую работу не замедляет.</li>
      <li>Чтобы различать файлы одного цвета: если пару секунд ничего не делать, контуры всех файлов коротко вспыхнут; во время переноса контуры видны всё время.</li>
      <li>Время обработки = клетки × скорость типа (см. ниже): мелочь уходит быстро, крупный RAW держит робота долго. Цвет — тип файла. Крупным RAW нужен сплошной кусок: укладывайте плотно и переставляйте лежащие файлы.</li>
      <li><b>Управление в замедлении:</b> пока вы двигаете файл, который уже лежит в памяти, или выбираете тип робота в веере, вся игра идёт вдвое медленнее — но только первые 3 секунды.</li>
      <li><b>Замедлить</b> (кнопка с песочными часами в панели входа) — запас времени: нажмите, и игра идёт вдвое медленнее (запас переполнения тоже), нажмите ещё раз — остановится, остаток сохранится. Запас (3 с) восполняется сам, пока замедление выключено. Жёлтая кнопка «+2 с · 15 кр.» увеличивает запас до конца смены (до трёх раз).</li>
      <li><b>Кластеры.</b> Два и больше файла одного типа, касающиеся сторонами, — кластер (белая обводка и «×N»). Он уходит в работу целиком, когда подходит очередь его самого старого файла, обрабатывается на 15% быстрее, но держит всю свою память до конца. Свободные роботы со специализацией на этот тип подключаются к кластеру: двое — ×1,8, трое — ×2,5. Файл, приложенный к кластеру уже в работе, ждёт своей очереди.</li>
      <li><b>Вирусы.</b> Когда горит «Угроза: в потоке вирус», среди входящих файлов прячутся вирусы — снаружи как обычные. В памяти вирус просыпается в случайный момент (через 5–30 с) или сразу, когда до него доберётся обычный робот. Файлы, пришедшие во время угрозы и не проверенные AV, помечены «?» — какой из них вирус, неизвестно и раз в 5 с заражает соседа по стороне; заражённые тоже заражают дальше. Пустая клетка останавливает цепочку. Заражённые файлы обрабатываются вдвое дольше и не приносят кредитов. <b>Уничтожить вирус может только робот AV</b> (зажмите робота → AV): он проверяет файлы с «?» на входе (≈1 с на файл, ✓ — чисто, вирус удаляет прямо в очереди), а проснувшиеся вирусы в памяти удаляет всегда (+3 кр. за вирус). AV стоит 1 кредит каждые 2 с, пока включён, и без угрозы простаивает — не забудьте вернуть робота.</li>
      <li>Вход вмещает <b>24 клетки</b> (шкала справа): большие файлы занимают больше места. Переполнился — загорится красная шкала: запас 10 секунд, чтобы освободить вход, иначе смена проиграна. Запас восстанавливается медленно (1 с за 2 с), так что частые переполнения складываются. Продержитесь 2 минуты.</li>
      
    </ul><div class="legend"><span style="background:var(--tmp)">TMP · 1–3 кл. · 1 с/кл.</span><span style="background:var(--doc)">DOC · 4–5 · 1,5 с/кл.</span><span style="background:var(--png)">PNG · 4–6 · 1,5 с/кл.</span><span style="background:var(--raw)">RAW · 5–10 · 1,7 с/кл.</span></div></template></div>

<script>

of stopping it; v40: fix — a track chosen in pause keeps playing (no preview cut-off); v39: infected files look «data corruption» (variant В, lighter): slight darkening, magenta outline, magenta bits running inside; infection travels as a stream of bits; v38: infected ×2, threats ≈50–53 s and ≈80–83 s (a short calm between), AV 1 cr. / 2 s; v37: shape numbers hidden on files (type only); v36: only AV can destroy viruses (a plain robot that touches a sleeping one wakes it); AV costs 1 cr. / 3 s and idles outside threats; «threat over — switch back» reminder; v35: AV scans only during a threat; threats moved to ≈55–60 s and ≈90 s, away from the 2nd-robot purchase; v34: viruses — announced threat windows, hidden viruses wake in memory and infect neighbours in a chain that stops at empty cells; AV robot scans the intake; trash removed; v33: juice — placed file settles with a springy bounce and flash; intake panel shakes on overflow; confetti on a win, memory powers down on a loss (dialog waits ~1 s); v32: sound (soft-plastic + hi-tech mix), lo-fi / synthwave music, iPhone vibration; settings in pause; v31: juice — bits stream while a robot works, a defrag wave + coin to the credits when a file is done, a pixel burst for RAW; v30: intake panel reaches the board — files, intake gauge, reserve bar and trash in one place; big ⟳ (1.5× a robot card); while a file is in hand the whole bottom bar turns it; v29: two hands — a ⟳ button for the holding thumb turns the file in hand (press while the other hand carries); left/right-handed layout; dip gesture retired; v28: dips deeper (3 cells) still count as a turn; the buy card glows when a robot is affordable and nudges after 4 s; v27: touch — turning the finger's path from down to up turns the file, no timing; while the finger dips the file holds its height; v26: click thresholds widened to the measured thumb (≈0.27 s, ≈78 px); v25: touch — a quick down-and-up 'click' of the thumb while carrying turns the file 90° clockwise around const VERSION='v57', COLS=8, ROWS=10, SHIFT=120, QCELLS=24, VIS=3, FLOW=[2.8,1.9], PRICES=[30,50], MAXR=3, TRASH_COST=3;

const board=$('board'), tray=$('tray'), cur=$('current'), next=$('next'), trash=document.createElement('div'); // the trash was removed in v34 (never used); kept detached so old code paths stay inert

// ---------- Clusters (v43) ----------
// Decisions (author, 2026-10-21): two or more files of one type touching by a side form a cluster. The cluster goes to
// work as a whole when its oldest file's turn comes (so placing a fresh file next to an old one moves it up the queue);
// it takes CL_TIME of the files' total time but holds all its memory until it is done. Free robots specialised in that
// type join a running cluster (×1.8 with two, ×2.5 with three); «Любые» do not. A file laid against a cluster already in
// work waits for its own turn. Hidden viruses inside a cluster wake when it starts and are left behind.
const CL_TIME=0.85, CL_SPEED=[1,1.8,2.5], CL_MAXBOTS=3;
function runningProcs(){const out=new Set();for(const p of S.pieces.values())if(p.proc)out.add(p.proc);return [...out];}
function clusterOf(p,free){if(!DCFG().clusters)return [p];const ok=new Set(free.filter(q=>q.type===p.type&&!(q.vir&&q.awake)).map(q=>q.id));ok.add(p.id);
  const seen=new Set([p.id]),out=[p],stack=[p];while(stack.length){const c=stack.pop();for(const n of neighbours(c))if(!seen.has(n.id)&&ok.has(n.id)){seen.add(n.id);out.push(n);stack.push(n);}}return out;}

function clustersNow(){if(!DCFG().clusters)return new Map();const free=[...S.pieces.values()].filter(q=>!q.proc&&!(q.vir&&q.awake)&&!(drag?.moved&&drag.from==='board'&&drag.id===q.id));const res=new Map(),done=new Set();
  for(const q of free.sort((a,b)=>a.order-b.order)){if(done.has(q.id))continue;const g=clusterOf(q,free);g.forEach(x=>done.add(x.id));if(g.length>1)for(const x of g)res.set(x.id,{n:g.length,lead:g[0].id===q.id?q.id:q.id});
    if(g.length>1)res.get(q.id).isLead=true;}return res;}

// ---------- Viruses and the AV robot (v34) ----------
// Decisions (author, 2026-10-21): no trash; a threat is announced ahead («Угроза: в потоке вирус») and viruses arrive only
// inside those windows, looking like ordinary files. In memory a virus wakes after V_WAKE s and then infects one side
// neighbour every V_SPREAD s; infected files pass it on too, so it is a chain — an empty cell stops it («просека»).

// (V_SCAN s each, ✓) and deletes a found virus right in the queue (+V_BONUS) — but while scanning it does no memory work;
// with nothing to scan it takes awake viruses first, then works like «Любые».

const BUG_SVG='<svg viewBox="0 0 20 20" width="100%" height="100%" aria-hidden="true"><ellipse cx="10" cy="11.5" rx="5" ry="6" fill="#14123a"/><circle cx="10" cy="5" r="3" fill="#14123a"/><path d="M5 9 1.5 7M5 12H1M5 15l-3 2.5M15 9l3.5-2M15 12h4M15 15l3 2.5M8.5 3 7 .8M11.5 3 13 .8" stroke="#14123a" stroke-width="1.6" stroke-linecap="round"/><path d="M10 6v11" stroke="#ff3d7f" stroke-width="1.2"/></svg>';
function prefColor(pf){return pf==='AV'?'var(--av)':TYPES[pf].color;}
function planThreats(){const a=50+Math.random()*3,b=80+Math.random()*3; /* windows 25 s each, a short calm in between */return [a,b].map(t=>({start:t,end:t+V_WIN,left:1+(Math.random()<.5?1:0),on:false}));}
function threatNow(){return S?.threats?.find(w=>S.time>=w.start&&S.time<w.end);}
function maybeVirus(f,interval){const w=threatNow();if(w){f.sus=1;const l=F(f.id);if(l)l.sus=1;}if(!w||w.left<=0||S.time<w.start+3)return f;
  const remain=Math.max(1,(w.end-S.time)/Math.max(.5,interval));if(Math.random()>=w.left/remain)return f;
  w.left--;f.vir=true;S.vs.arrived++;
  if(f.shape.length>V_MAXCELLS){const pool=['TMP','DOC','PNG'].flatMap(t=>TYPES[t].shapes.filter(sh=>sh.length<=V_MAXCELLS).map(sh=>({t,sh})));const c=pool[Math.floor(Math.random()*pool.length)];f.type=c.t;f.shape=c.sh.map(x=>[...x]);}
  const l=F(f.id);if(l){l.vir=1;l.ty=f.type;}ev('virus-arrive',f.id);return f;}
function pieceReward(p){if(p.vir)return V_BONUS;return p.infected?0:TYPES[p.type].reward;}
function neighbours(p){const ids=new Set();for(const [x,y] of p.shape){const gx=p.ox+x,gy=p.oy+y;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const v=S.grid[gy+dy]?.[gx+dx];if(v&&v!==p.id)ids.add(v);}}return [...ids].map(id=>S.pieces.get(id)).filter(Boolean);}
function virusTick(dt){
  // AV costs credits for as long as it is switched on
  const avs=S.bots.filter(b=>b.pref==='AV').length;
  if(avs){S.avAcc=(S.avAcc||0)+dt;while(S.avAcc>=V_COST_EVERY){S.avAcc-=V_COST_EVERY;const c=Math.min(S.credits,avs);if(c>0){S.credits-=c;S.vs.avCost+=c;fxCost(c);}}}else S.avAcc=0;
  // reminder: the threat is over and no awake virus is left, but a robot is still on AV
  const nag=avs>0&&S.threats.some(w=>w.on)&&!threatNow()&&![...S.pieces.values()].some(p=>p.vir&&p.awake)&&!S.queue.slice(0,VIS).some(f=>f.sus&&!f.scan);
  if(nag&&!S.avNag){S.avNag=S.time;ev('av-nag');}else if(!nag&&S.avNag){ev('av-nag-off',r1(S.time-S.avNag));S.avNag=0;}
  // announce a threat window
  for(const [i,w] of S.threats.entries()){if(!w.on&&S.time>=w.start){w.on=true;ev('threat',i+1,w.left);sfx('threat');haptic('warning');}}
  for(const p of [...S.pieces.values()]){if(drag?.moved&&drag.from==='board'&&drag.id===p.id)continue;
    if(p.vir&&!p.awake&&!p.proc&&S.time>=p.wakeAt)wakeVirus(p,'time');
    const spreading=(p.vir&&p.awake&&!p.proc)||(p.infected&&!p.proc);
    if(spreading&&S.time>=p.spreadAt){const cand=neighbours(p).filter(q=>!q.vir&&!q.infected&&!q.proc&&!(drag?.moved&&drag.id===q.id));
      if(cand.length){const q=cand[Math.floor(Math.random()*cand.length)];q.infected=1;q.spreadAt=S.time+V_SPREAD;S.vs.infected++;const l=F(q.id);if(l)l.inf=r1(S.time);ev('infect',p.id,q.id);fxInfect(q,p);sfx('infect');haptic('tick');p.spreadAt=S.time+V_SPREAD;}
      else p.spreadAt=S.time+1;}}}
function wakeVirus(p,why,bot){p.awake=1;p.spreadAt=S.time+V_SPREAD;S.vs.woke++;ev('virus-wake',p.id,why,bot);fxVirusWake(p);sfx('glitch');haptic('warning');}
function avStartScan(b){const taken=new Set(S.bots.filter(x=>x.scan).map(x=>x.scan.id));
  for(let i=0;i<Math.min(VIS,S.queue.length);i++){const f=S.queue[i];if(!f.sus||f.scan||taken.has(f.id)||(drag&&drag.id===f.id))continue;b.scan={id:f.id,t:0,dur:V_SCAN};b.busy=null;return true;}return false;}
function avTick(dt){for(const b of S.bots){if(!b.scan)continue;if(b.pref!=='AV'){b.scan=null;continue;}
  const i=S.queue.findIndex(f=>f.id===b.scan.id),f=S.queue[i];if(!f||i>=VIS||(drag&&drag.id===f.id)){b.scan=null;continue;}
  b.scan.t+=dt;if(b.scan.t<b.scan.dur)continue;b.scan=null;S.vs.scanned++;
  if(f.vir){S.queue.splice(i,1);S.credits+=V_BONUS;S.vs.avDel++;const l=F(f.id);if(l)l.out='av-deleted';ev('av-del',f.id,b.id);fxAvDel(slots[i]);sfx('avdel');haptic('success');}
  else{f.scan=1;ev('scan',f.id,b.id);sfx('scan');}}}
function renderVirusUi(){const lane=$('lane');let th=lane.querySelector('.threat');if(!th){th=document.createElement('div');th.className='threat';th.hidden=true;th.setAttribute('role','status');th.innerHTML=`<span class="ic">${BUG_SVG}</span><span>Угроза: в потоке вирус</span><b></b>`;lane.append(th);}
  const w=S.state==='over'?null:threatNow(),live=S.state==='over'?0:[...S.pieces.values()].filter(p=>p.vir&&p.awake).length,hasAV=S.bots.some(b=>b.pref==='AV');
  const msg=live?(hasAV?`AV удаляет вирус${live>1?' ('+live+')':''}`:`Вирус в памяти${live>1?' ('+live+')':''} — включите AV`):w?'Угроза: в потоке вирус':'';
  th.hidden=!msg;th.classList.toggle('live',!!live);if(msg){const sp=th.querySelector('span:not(.ic)');if(sp.textContent!==msg)sp.textContent=msg;th.querySelector('b').textContent=!live&&w?Math.ceil(w.end-S.time)+' с':'';}
  slots.forEach((sl,i)=>{const f=S.queue[i];const scanning=!!(f&&S.bots.some(b=>b.scan?.id===f.id));
    let bd=sl.querySelector('.sbadge'),beam=sl.querySelector('.scanbeam');
    const mode=!f?'':f.scan?'ok':(f.sus&&!scanning)?'q':'';
    if(mode){if(!bd){bd=document.createElement('div');sl.append(bd);}bd.className='sbadge '+mode;bd.textContent=mode==='ok'?'✓':'?';}else bd?.remove();
    sl.classList.toggle('scanning',scanning);if(scanning&&!beam){beam=document.createElement('div');beam.className='scanbeam';sl.append(beam);}else if(!scanning)beam?.remove();});}
function fxVirusWake(p){if(REDUCED)return;requestAnimationFrame(()=>{const el=board.querySelector(`.piece[data-id="${p.id}"]`);el?.querySelectorAll('.cell').forEach(c=>c.animate([{transform:'translate(0,0)',filter:'hue-rotate(0)'},{transform:'translate(-3px,1px)',filter:'hue-rotate(90deg) brightness(1.6)'},{transform:'translate(3px,-1px)'},{transform:'translate(0,0)',filter:'hue-rotate(0)'}],{duration:420,iterations:2}));});
  vbits(p,10);}
function fxInfect(q,src){if(REDUCED)return;if(src)fxStream(src,q);requestAnimationFrame(()=>{const el=board.querySelector(`.piece[data-id="${q.id}"]`);el?.querySelectorAll('.cell').forEach(c=>c.animate([{boxShadow:'0 0 0 0 rgba(255,61,127,0)'},{boxShadow:'0 0 16px 4px rgba(255,61,127,.9)'},{boxShadow:'0 0 0 0 rgba(255,61,127,0)'}],{duration:600}));});}
function fxStream(a,b){const o=boardXY(),ctr=p=>{const n=p.shape.length;return [o.x+(p.ox+p.shape.reduce((s,c)=>s+c[0],0)/n+.5)*cell,o.y+(p.oy+p.shape.reduce((s,c)=>s+c[1],0)/n+.5)*cell];};
  const [sx,sy]=ctr(a),[tx,ty]=ctr(b),lift=cell*.6;
  for(let i=0;i<7;i++){const e=fxEl('vbit',sx,sy);e.textContent=i%2?'1':'0';
    e.animate([{transform:'translate(0,0)',opacity:0},{transform:`translate(${(tx-sx)*.5}px,${(ty-sy)*.5-lift}px)`,opacity:1,offset:.5},{transform:`translate(${tx-sx}px,${ty-sy}px)`,opacity:.2}],{duration:620,delay:i*70,easing:'ease-in-out',fill:'backwards'}).onfinish=()=>e.remove();}}
function vbits(p,n){const o=boardXY();for(let k=0;k<n;k++){const [x,y]=p.shape[Math.floor(Math.random()*p.shape.length)];const e=fxEl('vbit',o.x+(p.ox+x)*cell+cell*(.2+.6*Math.random()),o.y+(p.oy+y)*cell+cell*.4);e.textContent=Math.random()<.5?'0':'1';
  e.animate([{transform:'translate(0,0)',opacity:0},{opacity:1,offset:.15},{transform:`translate(${(Math.random()-.5)*cell}px,${-cell*(.5+Math.random()*.6)}px)`,opacity:0}],{duration:700+Math.random()*300,delay:Math.random()*150}).onfinish=()=>e.remove();}}
function fxVirusDone(p){sfx('avdel');haptic('medium');if(REDUCED)return;const o=boardXY();
  p.shape.forEach(([x,y],i)=>{const f=fxEl('fxcell',o.x+(p.ox+x)*cell+2,o.y+(p.oy+y)*cell+2,cell-4,cell-4,{background:'var(--vir)',borderRadius:'6px'});
    f.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.1) skewX(12deg)',opacity:1,offset:.3},{transform:'scale(.1) skewX(-20deg)',opacity:0}],{duration:380,delay:i*40}).onfinish=()=>f.remove();});vbits(p,12);}
function fxCost(c){if(REDUCED)return;const chip=$('credits').closest('.chip'),r=chip.getBoundingClientRect();const e=fxEl('vbit',r.left+r.width*.55,r.bottom-4);e.style.color='#ff9cbf';e.style.fontSize='13px';e.textContent='−'+c;
  e.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(16px)',opacity:0}],{duration:800}).onfinish=()=>e.remove();}
function fxAvDel(sl){if(REDUCED||!sl)return;sl.animate([{boxShadow:'0 0 0 0 rgba(255,61,127,0)'},{boxShadow:'0 0 0 4px #ff3d7f, 0 0 22px #ff3d7f'},{boxShadow:'0 0 0 0 rgba(255,61,127,0)'}],{duration:650});
  const r=sl.getBoundingClientRect();for(let k=0;k<8;k++){const e=fxEl('vbit',r.left+r.width*(.2+.6*Math.random()),r.top+r.height*.5);e.textContent=Math.random()<.5?'0':'1';e.animate([{opacity:1},{transform:`translate(${(Math.random()-.5)*50}px,${-20-Math.random()*30}px)`,opacity:0}],{duration:650}).onfinish=()=>e.remove();}}

// ---------- Sound, music and vibration (v32) ----------
// Direction (author, 2026-10-21): light and calm — soft «plastic» pops and marimba mixed with clean hi-tech glass and air;
// music lo-fi or synthwave pulse, quiet under the game. Frequent sounds are the softest. All synthesized (Web Audio),
// no files. Vibration goes to the iPhone app through the same bridge as the logs. Settings live in pause and are remembered.
const AUD={sfx:true,music:'lofi',haptics:true};
try{Object.assign(AUD,JSON.parse(localStorage.getItem('defrag-audio')||'{}'));}catch(e){}
function audioSave(){try{localStorage.setItem('defrag-audio',JSON.stringify(AUD));}catch(e){}}
let AC=null,OUT=null,SFX=null,MUS=null,MF=null,REV=null;
function audioInit(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();
    OUT=AC.createDynamicsCompressor();OUT.threshold.value=-14;OUT.ratio.value=4;OUT.connect(AC.destination);
    SFX=AC.createGain();SFX.gain.value=.8;SFX.connect(OUT);MUS=AC.createGain();MUS.gain.value=.45;MF=AC.createBiquadFilter();MF.type='lowpass';MF.frequency.value=18000;MF.Q.value=.7;MUS.connect(MF);MF.connect(OUT);
    REV=AC.createConvolver();const len=AC.sampleRate*1.3,b=AC.createBuffer(2,len,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
    REV.buffer=b;const rg=AC.createGain();rg.gain.value=.22;REV.connect(rg);rg.connect(OUT);}
  if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,{t=0,d=.12,type='sine',g=.25,a=.004,f2=null,wet=0,detune=0,bus=SFX}={}){if(!AC)return;const o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),s+d);o.detune.value=detune;
  v.gain.setValueAtTime(0,s);v.gain.linearRampToValueAtTime(g,s+a);v.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(v);v.connect(bus);if(wet){const w=AC.createGain();w.gain.value=wet;v.connect(w);w.connect(REV);}o.start(s);o.stop(s+d+.05);}
const NOISE={};
function noise({t=0,d=.15,g=.2,hp=0,lp=12000,f2=null,wet=0,bus=SFX}={}){if(!AC)return;if(!NOISE.b){const len=AC.sampleRate,b=AC.createBuffer(1,len,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=Math.random()*2-1;NOISE.b=b;}
  const src=AC.createBufferSource();src.buffer=NOISE.b;const s=AC.currentTime+t,fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lp,s);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,s+d);
  const h=AC.createBiquadFilter();h.type='highpass';h.frequency.value=hp;const v=AC.createGain();v.gain.setValueAtTime(g,s);v.gain.exponentialRampToValueAtTime(.0001,s+d);
  src.connect(fl);fl.connect(h);h.connect(v);v.connect(bus);if(wet){const w=AC.createGain();w.gain.value=wet;v.connect(w);w.connect(REV);}src.start(s,Math.random()*.5);src.stop(s+d+.05);}
const MID=n=>440*Math.pow(2,(n-69)/12),PENTA=[84,86,88,91,93,96,98,100];
const mar=(f,t,g=.24,bus=SFX)=>{tone(f,{t,d:.35,g,wet:.3,bus});tone(f*4,{t,d:.06,g:g*.25,bus});};
const glass=(f,t,g=.12,bus=SFX)=>{tone(f,{t,d:.6,g,wet:.6,bus});tone(f*2.01,{t,d:.3,g:g*.4,wet:.6,bus});};
const SOUNDS={
  place:()=>{tone(520,{d:.12,g:.28,f2:180});noise({d:.025,g:.06,hp:3500});},
  rotate:()=>{noise({d:.09,g:.07,hp:900,lp:7000,f2:1800});tone(880,{type:'triangle',d:.045,g:.07,f2:640});},
  tick:i=>glass(MID(PENTA[Math.min(i,7)]),0,.07),
  coin:()=>{mar(MID(88),0,.16);glass(MID(93),.07,.08);},
  burst:()=>{tone(70,{d:.4,g:.42,f2:35});noise({d:.55,g:.12,hp:3500,wet:.5});[96,100,103].forEach((n,i)=>glass(MID(n),.05+i*.045,.06));},
  buy:()=>{tone(300,{d:.4,g:.1,f2:1100,type:'sawtooth',wet:.3});glass(MID(91),.36,.12);mar(MID(79),.36,.14);},
  ready:()=>glass(MID(96),0,.06),
  alarm:()=>{tone(700,{d:.3,g:.12,f2:520,wet:.2});tone(700,{t:.42,d:.3,g:.12,f2:520,wet:.2});},
  beat:()=>{tone(92,{d:.22,g:.22,f2:60});},
  bad:()=>{tone(220,{type:'triangle',d:.16,g:.16,f2:150});},
  trash:()=>{noise({d:.3,g:.16,lp:3500,f2:250});tone(160,{t:.05,d:.2,g:.16,f2:90});},
  pref:()=>tone(1150,{type:'triangle',d:.04,g:.06}),
  threat:()=>{tone(MID(76),{d:.35,g:.11,wet:.4});tone(MID(71),{t:.3,d:.45,g:.11,wet:.4});glass(MID(95),.05,.05);},
  glitch:()=>{noise({d:.18,g:.18,hp:1200,lp:6000});tone(180,{type:'sawtooth',d:.14,g:.08,f2:90,detune:30});tone(1900,{type:'square',t:.05,d:.04,g:.04});},
  infect:()=>{noise({d:.08,g:.08,hp:2500});tone(260,{type:'sawtooth',d:.1,g:.05,f2:180});},
  scan:()=>glass(MID(100),0,.04),
  boost:()=>{glass(MID(98),0,.05);glass(MID(103),.06,.05);},
  slowIn:()=>{tone(900,{d:.45,g:.12,f2:260,wet:.4});noise({d:.4,g:.06,hp:600,lp:5000,f2:800});},
  slowOut:()=>{tone(300,{d:.3,g:.1,f2:820,wet:.3});},
  combo:n=>{[0,4,7,12,16].slice(0,Math.min(5,1+n)).forEach((k,i)=>mar(MID(76+k),.08+i*.07,.18));glass(MID(100),.12+Math.min(5,1+n)*.07,.08);},
  avdel:()=>{noise({d:.12,g:.1,hp:2000});tone(500,{d:.18,g:.14,f2:140});glass(MID(91),.1,.08);},
  win:()=>{[[72,0],[76,.14],[79,.28],[84,.42]].forEach(([n,t])=>mar(MID(n),t,.22));[84,88,91].forEach(n=>glass(MID(n),.6,.09));tone(MID(48),{t:.42,d:.9,g:.2,wet:.3});},
  lose:()=>{tone(400,{d:1,g:.14,f2:80,type:'triangle',wet:.3});noise({t:.2,d:.8,g:.07,lp:1200,f2:150});},
};
function sfx(name,arg){if(!AUD.sfx||!AC||AC.state!=='running')return;try{SOUNDS[name]?.(arg);}catch(e){}}
function haptic(style){if(!AUD.haptics||!HAPT)return;try{if(NATIVE){window.webkit.messageHandlers.defrag.postMessage({type:'haptic',style});return;}const h=TG.HapticFeedback;
  if(style==='tick')h.selectionChanged();else if(style==='success'||style==='warning'||style==='error')h.notificationOccurred(style);else h.impactOccurred(['light','medium','heavy','soft','rigid'].includes(style)?style:'light');}catch(e){}}
function sfxEvent(a){const [k,b,c,d]=a;
  if(k==='drop'){if(d==='placed'||d==='moved'){sfx('place');haptic('light');fxPlace(c);}else if(d==='rotate'){sfx('rotate');haptic('soft');}else if(d==='no-room'||d==='rotate-blocked'){sfx('bad');haptic('tick');}}
  else if(k==='rot-btn'){if(c){sfx('rotate');haptic('soft');}}
  else if(k==='rotate-key'){sfx('rotate');}
  else if(k==='buy'){sfx('buy');haptic('success');}
  else if(k==='buy-ready'){sfx('ready');}
  else if(k==='overflow'){sfx('alarm');haptic('warning');beatAcc=0;fxShake(7);}
  else if(k==='trash'){sfx('trash');haptic('medium');}
  else if(k==='pref'){sfx('pref');haptic('tick');}}
let beatAcc=0;
function sfxTick(dt){if(S?.over){beatAcc+=dt;if(beatAcc>=1){beatAcc=0;sfx('beat');fxShake(2.5);}}}
// music: short loops scheduled a little ahead; quiet under the game
const LOOPS={
  lofi:{bpm:84,step:(i,t)=>{const ch=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]][Math.floor(i/16)%4];
    if(i%16===0)ch.forEach(n=>tone(MID(n),{t,d:2.6,g:.03,a:.3,wet:.5,type:'triangle',bus:MUS}));if(i%4===2)mar(MID(ch[(i>>2)%4]+12),t,.05,MUS);
    if(i%8===0)tone(70,{t,d:.3,g:.16,f2:45,bus:MUS});if(i%8===4)noise({t,d:.08,g:.035,hp:3000,lp:7000,bus:MUS});}},
  synth:{bpm:100,step:(i,t)=>{const root=[45,41,43,40][Math.floor(i/16)%4];
    tone(MID(root),{t,type:'sawtooth',d:.12,g:.04,bus:MUS});if(i%4===0)tone(55,{t,d:.25,g:.2,f2:40,bus:MUS});if(i%8===4)noise({t,d:.12,g:.05,hp:1500,wet:.3,bus:MUS});
    if(i%16===0)[0,7,12,16].forEach(k=>tone(MID(root+24+k),{t,d:2.2,g:.018,a:.4,wet:.6,type:'sawtooth',detune:6,bus:MUS}));}},
};
let mus=null;
function musicStart(){musicStop();if(!AC||AUD.music==='off'||!LOOPS[AUD.music])return;const L0=LOOPS[AUD.music],sp=60/L0.bpm/4;let i=mus?.i||0,next=AC.currentTime+.08;
  mus={i,id:setInterval(()=>{if(!AC)return;while(next<AC.currentTime+.3){L0.step(mus.i,next-AC.currentTime);mus.i++;next+=sp;}},60)};}
// pause: the music goes quiet and muffled, as if through a wall; «Продолжить» brings it back
function musicMuffle(on){if(!AC||!MF)return;const t=AC.currentTime;MF.frequency.cancelScheduledValues(t);MUS.gain.cancelScheduledValues(t);
  MF.frequency.setTargetAtTime(on?520:18000,t,on?.18:.12);MUS.gain.setTargetAtTime(on?.26:.45,t,on?.2:.12);}
function musicStop(){if(mus){clearInterval(mus.id);mus={i:mus.i,id:null};}}
function renderAudioSet(){const box=$('audioSet');if(!box)return;
  const b=(id,label,on,fn)=>`<button id="${id}" class="${on?'on':''}">${label}</button>`;
  box.innerHTML=b('aSfx','Звуки',AUD.sfx)+b('aLofi','♪ Лоу-фай',AUD.music==='lofi')+b('aSynth','♪ Синтвейв',AUD.music==='synth')+b('aOff','Без музыки',AUD.music==='off')+(HAPT?b('aHap','Вибрация',AUD.haptics):'');
  const set=(k,v)=>{AUD[k]=v;audioSave();ev('audio',k,v);renderAudioSet();audioInit();if(k==='music'){if(v==='off')musicStop();else musicStart();} /* the chosen track keeps playing in pause and carries on after «Продолжить» (v40: the old 2.6 s preview timer cut it off) */if(k==='sfx'&&v)sfx('coin');if(k==='haptics'&&v)haptic('success');};

  if(DAYS[S.day].tut){const sk=document.createElement('button');sk.textContent='Пропустить обучение';sk.onclick=()=>{setProg(5,{hintsOff:true});ev('skip-tutorial',S.day);S.state='play';start();};row.append(sk);}
  $('dialog').append(row);}
function pause2(){S.state='play';pause();}
$('skipBtn').hidden=curDay()===0;$('replayBtn').hidden=curDay()!==0;
function replayTutorial(){SEEN={};try{localStorage.removeItem('defrag-coach-v50');}catch(e){}setProg(1,{hintsOff:false});if(S)ev('replay-tutorial');const rb=$('replayBtn');if(rb)rb.hidden=true;if(S?.state==='pause')S.state='play';start();}
$('replayBtn').onclick=replayTutorial;
// v55 (author): on every load the start screen lets him start from any day — day 1 to 4 or the full shift
function startDay(d){SEEN={};try{localStorage.removeItem('defrag-coach-v50');}catch(e){}setProg(d,{hintsOff:d>4});start();}
document.querySelectorAll('#dialog .daypick button').forEach(b=>{b.classList.toggle('on',+b.dataset.d===(curDay()||5));b.onclick=()=>startDay(+b.dataset.d);});
$('skipBtn').hidden=true;$('replayBtn').hidden=true;
$('startBtn').textContent=curDay()?'Играть · день '+curDay():'Играть · полная смена';
$('skipBtn').onclick=()=>{setProg(5,{hintsOff:true});$('skipBtn').hidden=true;start();};
if(curDay()>1)$('startBtn').textContent='Играть · день '+curDay();
tutLabels(curDay());

// ---------- Two hands: the ⟳ button (v29) ----------
// One hand carries the file, the thumb of the hand holding the phone presses ⟳: the file in hand turns 90° clockwise around
// its centre at the moment of the press (pointerdown — a second finger, so the carry is not interrupted). With nothing in
// hand the button does nothing (a tap on a queued file still turns it). The side of the button follows the chosen hand.
let HAND='right';try{HAND=localStorage.getItem('defrag-hand')==='left'?'left':'right';}catch(e){}
function applyHand(){document.documentElement.classList.toggle('lefty',HAND==='left');}
applyHand();
function setHand(h){HAND=h;try{localStorage.setItem('defrag-hand',h);}catch(e){}applyHand();ev('hand',h);}
const rotBtn=$('rotBtn');
rotBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(S?.state!=='play')return;
  rotBtn.classList.add('hit');setTimeout(()=>rotBtn.classList.remove('hit'),90);
  if(drag?.moved){rotateDrag('кнопка');ev('rot-btn',drag.id,1);}else ev('rot-btn',null,0);});
rotBtn.addEventListener('click',e=>e.preventDefault());
// While a file is in hand, a second finger anywhere on the bottom bar turns it (robots and buying wait until the file is down).
const actionsEl=document.querySelector('.actions');let swallowClick=0;
actionsEl.addEventListener('pointerdown',e=>{if(!drag?.moved||e.pointerId===drag.pointerId||e.target===rotBtn||rotBtn.contains(e.target))return;
  e.preventDefault();e.stopPropagation();swallowClick=performance.now();rotBtn.classList.add('hit');setTimeout(()=>rotBtn.classList.remove('hit'),90);
  rotateDrag('нижняя полоса');ev('rot-btn',drag.id,2);},true);
actionsEl.addEventListener('click',e=>{if(performance.now()-swallowClick<800){e.stopPropagation();e.preventDefault();swallowClick=0;}},true);
rotBtn.addEventListener('contextmenu',e=>e.preventDefault());
// ---------- Double tap to turn (touch, retired in v23) ----------
// Lifting the finger does not drop the file at once: for LIFT_WAIT the file stays where it is. Two quick taps on it
// turn it 90° around its centre (and it waits again); touching it and moving carries it on; otherwise it is placed.
const LIFT_WAIT=250, DTAP_GAP=350, TAP_NEAR=1.5;
function startLift(){const d=drag;clearTimeout(d.liftTimer);d.lift={taps:d.lift?.taps||[],down:null};d.pointerId=null;d.liftTimer=setTimeout(finishLift,d.lift.taps.length?DTAP_GAP:LIFT_WAIT);}
function finishLift(){if(!drag?.lift||drag.lift.down)return;const d=drag;d.lift=null;finishDrag(null);}
function nearFloat(x,y){const r=drag.float.getBoundingClientRect(),b=shapeBox(drag.file.shape,cell),m=TAP_NEAR*cell; // the float box itself has no size: use the shape's box
  return x>=r.left-m&&x<=r.left+b.w+m&&y>=r.top-m&&y<=r.top+b.h+m;}
addEventListener('pointerdown',e=>{const d=drag;if(!d?.lift)return;
  if(!nearFloat(e.clientX,e.clientY)){clearTimeout(d.liftTimer);d.lift=null;finishDrag(null);return;} // a press elsewhere: place it and go on
  e.preventDefault();e.stopPropagation();clearTimeout(d.liftTimer);
  d.lift.down={x:e.clientX,y:e.clientY,t:performance.now()};d.pointerId=e.pointerId;
  const fl=d.float.getBoundingClientRect(),h=holdPt(e);d.off={x:fl.left-h.x,y:fl.top-h.y};d.last={clientX:e.clientX,clientY:e.clientY,pointerId:e.pointerId,pointerType:e.pointerType};},true);
function liftUp(e){const d=drag,L0=d.lift,dn=L0.down;L0.down=null;
  if(L0.carry){L0.carry=false;L0.taps=[];moveDrag(e);startLift();return;} // carried on and lifted again
  const now=performance.now();L0.taps=L0.taps.filter(t=>now-t<DTAP_GAP);L0.taps.push(now);
  if(L0.taps.length>=2){L0.taps=[];rotateDrag('двойной тап');ev('dtap-turn',d.id);}
  startLift();}
function discard(from,id){
  if(from==='queue'){const i=qIndex(id);if(i>=0)S.queue.splice(i,1);}else{const p=S.pieces.get(id);if(p){setCells(p,0);S.pieces.delete(id);}}
  S.credits=Math.max(0,S.credits-TRASH_COST);S.trashed++;const l=F(id);if(l)l.out='trash';ev('trash',id,from);}
function endDrag(e){if(!drag||(e&&e.pointerId!==drag.pointerId))return;
  if(drag.lift){liftUp(e);return;}
  if(e)moveDrag(e);if(!drag)return;
  // touch: a lifted finger may come back for a double tap — wait a moment before placing
  finishDrag(e);}
function finishDrag(e){if(!drag)return;
  const d=drag;drag=null;clearTimeout(d.liftTimer);cleanup(d);
  const p=d.from==='board'?S.pieces.get(d.id):null;
  const dist=e?Math.round(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)):Math.round(Math.hypot(d.last.clientX-d.x0,d.last.clientY-d.y0)),ms=Math.round(performance.now()-d.t0);
  const tap=!d.moved||(d.from==='queue'&&e&&d.slotEl&&inside(d.slotEl,e.clientX,e.clientY)&&ms<600);
  let outcome;
  if(tap){outcome='rotate';
    if(d.from==='queue'){const i=qIndex(d.id);if(i>=0){S.queue[i].shape=rotate(d.moved?d.shape0:S.queue[i].shape);const l=F(d.id);if(l)l.r++;}}
    else if(p&&!p.proc){const r=rotate(p.shape);setCells(p,0);const at=snap(r,p.ox,p.oy);if(at){p.shape=r;p.ox=at.ox;p.oy=at.oy;S.moves++;const l=F(p.id);if(l)l.r++;}else outcome='rotate-blocked';setCells(p,p.id);}
  }else if(d.overTrash){discard(d.from,d.id);outcome='trash';}
  else if(d.from==='queue'){const i=qIndex(d.id);
    if(i>=0&&d.target?.spot){S.queue[i].shape=d.file.shape;S.queue.splice(i,1);place(d.file,d.target.spot.ox,d.target.spot.oy);outcome='placed';}
    else{if(i>=0)S.queue[i].shape=d.file.shape;outcome=d.target?'no-room':'dropped-outside';if(d.target){flashBad(d.file,d.target.ox,d.target.oy);const l=F(d.id);if(l)l.f++;}}}
  else if(p){setCells({...p,shape:d.shape0},0); /* v57: the piece still occupies its shape from before any turn in hand */
    if(d.target?.spot&&fits(p.shape,d.target.spot.ox,d.target.spot.oy)){if(d.target.spot.ox!==p.ox||d.target.spot.oy!==p.oy||p.shape!==d.shape0){p.ox=d.target.spot.ox;p.oy=d.target.spot.oy;S.moves++;const l=F(p.id);if(l)l.m++;}outcome='moved';}
    else{p.shape=d.shape0;outcome=d.target?'no-room':'dropped-outside';if(d.target)flashBad(p,d.target.ox,d.target.oy);}
    setCells(p,p.id);}
  ev('drop',d.from,d.id,outcome,dist,ms,d.last.pointerType);
  diag(`нажатие: ${lastDown} · сдвиг ${dist} px · ${ms} мс → ${outcome}`);lastDown='';
  render();}

slots.forEach((sl,i)=>{
  sl.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(S?.state!=='play')return;const f=S.queue[i];if(!f)return;e.preventDefault();
    const [gx,gy]=anchor(f.shape);beginDrag(e,'queue',{...f},gx,gy,sl);});
  sl.addEventListener('pointerenter',()=>{hoverSlot=i;sl.classList.add('hover');});
  sl.addEventListener('pointerleave',()=>sl.classList.remove('hover'));
  sl.addEventListener('contextmenu',e=>{e.preventDefault();e.rotDone=true;if(drag)return rotateDrag('правый клик');const f=S?.state==='play'&&S.queue[i];if(f){rotateQueued(f.id,'правый клик');ev('rotate-key',f.id,'right');}});
});
board.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(S?.state!=='play')return;e.preventDefault();
  const c=e.target.closest('.piece:not(.ghost):not(.float) .cell');const p=c&&S.pieces.get(+c.parentElement.dataset.id);
  if(p&&!p.proc){const [x,y]=p.shape[+c.dataset.i];beginDrag(e,'board',p,x,y,null);}});
board.addEventListener('contextmenu',e=>{e.preventDefault();e.rotDone=true;if(drag)return rotateDrag('правый клик');
  const c=e.target.closest('.piece:not(.ghost):not(.float) .cell'),p=c&&S?.pieces.get(+c.parentElement.dataset.id);if(!p||p.proc||S.state!=='play')return;
  const r=rotate(p.shape);setCells(p,0);const at=snap(r,p.ox,p.oy);if(at){p.shape=r;p.ox=at.ox;p.oy=at.oy;S.moves++;}setCells(p,p.id);diag('поворот: правый клик');render();});
addEventListener('contextmenu',e=>{if(drag&&!e.rotDone){e.preventDefault();rotateDrag('правый клик');}});
addEventListener('pointermove',moveDrag);
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',e=>{if(drag&&!drag.lift&&e.pointerId===drag.pointerId)cancelDrag();});
// diagnostics: remember what a press on the intake or the board hit; report presses nothing handled
const descr=el=>el?(el.id?'#'+el.id:(typeof el.className==='string'&&el.className?'.'+el.className.split(' ')[0]:el.tagName.toLowerCase())):'?';
addEventListener('pointerdown',e=>{lastDown=tray.contains(e.target)||board.contains(e.target)?`${e.pointerType} ${e.button} на ${descr(e.target)}`:'';},true);
addEventListener('pointerup',e=>{if(!drag&&lastDown&&e.button!==2){diag(`нажатие: ${lastDown} → не обработано`);if(S?.state==='play')ev('press-unhandled',lastDown);lastDown='';}},true);
addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='TEXTAREA')return;
  if(e.code==='KeyP'||e.key==='Escape'){e.preventDefault();S?.state==='pause'?resume():pause();return;}
  if(S?.state!=='play')return;
  if(e.code==='KeyR'||e.code==='Space'){e.preventDefault();const why=e.code==='Space'?'пробел':'R';
    if(drag){rotateDrag(why);ev('rotate-key',drag?.id,why);}else{const f=S.queue[hoverSlot]||S.queue[0];if(f){rotateQueued(f.id,why);ev('rotate-key',f.id,why);}}}});
// Safari / in-app panels: keep the finger on the file mid-drag (no page scroll, no long-press menu)
for(const el of [tray,board])el.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
tray.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelDrag();pause();}});
$('pauseBtn').onclick=pause;
$('startBtn').onclick=start;
if(NATIVE){$('exportBtn').hidden=false;$('exportBtn').onclick=exportLogs;}
addEventListener('resize',()=>S&&layout());
reset();S.state='idle';layout(); // nothing runs until «Начать смену»
})();
</script>
